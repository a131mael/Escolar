<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:p="http://primefaces.org/ui"
	template="/WEB-INF/templates/templateADM.xhtml">

	<ui:define name="content"
		rendered="#{authController.hasPermission(authController.administrador
		,authController.secretaria,authController.dono)}">
		<h:form style="width:100%; border:none">

			<h:panelGrid columns="0" width="100%;" styleClass="alinharTopo"
				style="margin-top: -30px;width:92%">

				<p:tabView>
					<p:tab title="Dados do Funcionario">
						<h:panelGrid columns="2" border="0">

							<h:outputLabel for="name" value="Nome(*): "
								style="font-size: 13px; width:180px" />
							<p:inputText id="nome" title="" value="#{professor.nome}"
								style="font-size: 15px; width:280px" />

							<h:outputLabel value="Codigo(*): "
								style="font-size: 13px; width:180px" />
							<p:inputText title="" value="#{professor.codigo}"
								style="font-size: 15px; width:280px" />

							<h:outputLabel value="Nascimento: "
								style="font-size: 13px; width:180px" />
							<p:calendar value="#{professor.nascimento}" pattern="dd/MM/yyyy"
								mask="true" style="font-size: 15px; width:280px" />
							
							<h:outputLabel value="CPF : "
								style="font-size: 13px; width:180px" />
							<p:inputMask value="#{professor.cpf}" mask="999.999.999-99"
								style="font-size: 15px; width:275px" />

							<h:outputLabel value="RG : "
								style="font-size: 13px; width:180px" />
							<h:inputText value="#{professor.rg}"
								style="font-size: 15px; width:280px" />
							
							<h:outputLabel value="Salário: "
								style="font-size: 13px; width:180px" />
							<p:inputNumber value="#{professor.salarioBd}"
								rendered="#{authController.hasPermission(authController.administrador,authController.dono)}"
								decimalSeparator="," thousandSeparator="."
								symbol="R$ " symbolPosition="p"
								minValue="0" decimalPlaces="2"
								style="font-size: 15px; width:280px" inputStyle="width:220px"/>
							

						</h:panelGrid>

					</p:tab>
					<p:tab title="CNH (Motorista)">
						<h:panelGrid columns="2" border="0">

							<h:outputLabel value="Número da CNH: "
								style="font-size: 13px; width:180px" />
							<p:inputText value="#{professor.cnhNumero}"
								style="font-size: 15px; width:280px" />

							<h:outputLabel value="Categoria: "
								style="font-size: 13px; width:180px" />
							<p:selectOneMenu value="#{professor.cnhCategoria}"
								style="font-size: 15px; width:285px">
								<f:selectItem itemLabel="Selecione" itemValue="" />
								<f:selectItem itemLabel="A" itemValue="A" />
								<f:selectItem itemLabel="B" itemValue="B" />
								<f:selectItem itemLabel="AB" itemValue="AB" />
								<f:selectItem itemLabel="AD" itemValue="AD" />
								<f:selectItem itemLabel="C" itemValue="C" />
								<f:selectItem itemLabel="D" itemValue="D" />
								<f:selectItem itemLabel="E" itemValue="E" />
							</p:selectOneMenu>

							<h:outputLabel value="Validade da CNH: "
								style="font-size: 13px; width:180px" />
							<p:calendar value="#{professor.cnhValidade}" pattern="dd/MM/yyyy"
								mask="true" style="font-size: 15px; width:280px" />

						</h:panelGrid>
					</p:tab>
					<p:tab title="Contato">
						<h:panelGrid columns="2" border="0">

							<h:outputLabel value="Endereço: "
								style="font-size: 13px; width:180px" />
							<p:inputText value="#{professor.endereco}"
								style="font-size: 15px; width:275px">
							</p:inputText>

							<h:outputLabel value="Telefone Fixo: "
								style="font-size: 13px; width:180px" />
							<p:inputMask value="#{professor.telefone1}"
								mask="(99)9999-9999" style="font-size: 15px; width:275px" />

							<h:outputLabel value="Celuar 1: "
								style="font-size: 13px; width:180px" />
							<p:inputMask value="#{professor.telefone2}"
								mask="(99) 9 99-999999" style="font-size: 15px; width:275px" />
							
							<h:outputLabel value="Celuar 2: "
								style="font-size: 13px; width:180px" />
							<p:inputMask value="#{professor.telefone3}"
								mask="(99) 9 99-999999" style="font-size: 15px; width:275px" />
								
							<h:outputLabel value="Email: "
								style="font-size: 13px; width:180px" />
							<p:inputText value="#{professor.email}"
								style="font-size: 15px; width:275px">
							</p:inputText>
								
							
						</h:panelGrid>

					</p:tab>
					<p:tab title="Pix / Pagamento">
						<h:panelGrid columns="2" border="0">

							<h:outputLabel value="Tipo da Chave Pix: "
								style="font-size: 13px; width:180px" />
							<p:selectOneMenu value="#{professor.tipoChavePix}" style="font-size: 15px; width:285px">
								<f:selectItem itemLabel="Selecione" itemValue="" />
								<f:selectItem itemLabel="CPF" itemValue="CPF" />
								<f:selectItem itemLabel="E-mail" itemValue="EMAIL" />
								<f:selectItem itemLabel="Telefone" itemValue="TELEFONE" />
								<f:selectItem itemLabel="Chave Aleatória (EVP)" itemValue="EVP" />
							</p:selectOneMenu>

							<h:outputLabel value="Chave Pix: "
								style="font-size: 13px; width:180px" />
							<p:inputText value="#{professor.chavePix}"
								style="font-size: 15px; width:280px"
								placeholder="CPF, e-mail, telefone ou chave aleatória" />

						</h:panelGrid>
					</p:tab>

					<p:tab title="Sistema">
						<h:panelGrid columns="2" border="0">

							<h:outputLabel value="Login: "
								style="font-size: 13px; width:180px" />
							<h:inputText title="" value="#{professor.login}"
								style="font-size: 15px; width:280px" />

							<h:outputLabel value="Senha: "
								style="font-size: 13px; width:180px" />
							<h:inputText title="" value="#{professor.senha}"
								style="font-size: 15px; width:280px" />

						</h:panelGrid>

					</p:tab>

				</p:tabView>

			</h:panelGrid>

			<div style="display:flex; justify-content:space-between; align-items:center; margin-top:20px; width:92%">
				<h:commandButton id="voltarButtom" immediate="true"
					action="#{professorController.voltar()}" value="Voltar"
					style="background-color:#6c757d; color:white; border:1px solid #565e64; padding:8px 20px; font-size:14px; cursor:pointer; border-radius:3px"/>
				<h:commandButton id="salvarButtom"
					action="#{professorController.salvar()}" value="Salvar"
					style="background-color:#00843D; color:white; border:1px solid #006830; padding:8px 20px; font-size:14px; cursor:pointer; border-radius:3px"/>
			</div>

		</h:form>
	</ui:define>
</ui:composition>
