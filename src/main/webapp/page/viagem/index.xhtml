<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:p="http://primefaces.org/ui"
	template="/WEB-INF/templates/templateADM.xhtml">

	<ui:define name="content">

		<h:form id="formViagem" style="width:100%; border:none; height:100%">

			<p:growl id="messages" showDetail="true" />

			<p:confirmDialog global="true" showEffect="fade" hideEffect="fade">
				<p:commandButton value="Sim" type="button" styleClass="ui-confirmdialog-yes" icon="ui-icon-check"/>
				<p:commandButton value="Não" type="button" styleClass="ui-confirmdialog-no" icon="ui-icon-close"/>
			</p:confirmDialog>

			<style type="text/css">
				.btn-add.ui-button { background:#43a047 !important; border-color:#43a047 !important; color:#fff !important; }
				.btn-edit.ui-button { background:#ffe082 !important; border-color:#ffca28 !important; color:#5d4037 !important; }
				.btn-delete.ui-button { background:#e53935 !important; border-color:#e53935 !important; color:#fff !important; }
			</style>

			<br/>

			<p:button value="Adicionar Viagem" icon="ui-icon-plus" styleClass="btn-add"
				outcome="editarViagem"/>

			<br/><br/>

			<p:dataTable id="tabela" var="f" value="#{calendarioController.fretes}"
				emptyMessage="Nenhuma viagem cadastrada." paginator="true" rows="10">

				<p:column headerText="Saída" sortBy="#{f.horarioLocalOrigem}">
					<h:outputText value="#{f.horarioLocalOrigem}">
						<f:convertDateTime pattern="dd/MM/yyyy HH:mm" timeZone="GMT-3"/>
					</h:outputText>
				</p:column>

				<p:column headerText="Origem" sortBy="#{f.localOrigem}">
					<h:outputText value="#{f.localOrigem}"/>
				</p:column>

				<p:column headerText="Destino" sortBy="#{f.localDestino}">
					<h:outputText value="#{f.localDestino}"/>
				</p:column>

				<p:column headerText="Contratante" sortBy="#{f.contratante.nome}">
					<h:outputText value="#{f.contratante.nome}"/>
				</p:column>

				<p:column headerText="Valor" sortBy="#{f.valor}">
					<h:outputText value="#{f.valor}">
						<f:convertNumber pattern="##,###.00"/>
					</h:outputText>
				</p:column>

				<p:column headerText="Status">
					<h:outputText value="Pago" rendered="#{calendarioController.isPago(f)}" style="color:#2e7d32;font-weight:bold;"
						title="Valor pago é igual ao valor da viagem."/>
					<h:outputText value="Aberto" rendered="#{!calendarioController.isPago(f)}" style="color:#c62828;font-weight:bold;"
						title="Valor pago ainda é diferente do valor da viagem. Para marcar como Pago, edite a viagem e preencha 'Valor Pago' igual ao 'Valor'."/>
				</p:column>

				<p:column headerText="Passageiros" style="text-align:center;">
					<h:outputText value="#{f.passageiros.size()}"/>
				</p:column>

				<p:column headerText="Link da Viagem" style="width:190px;">
					<h:panelGroup rendered="#{f.tokenPublico != null}" layout="block" style="display:flex;gap:4px;align-items:center;">
						<p:inputText value="#{calendarioController.getLinkViagem(f)}" readonly="true"
							style="width:140px" onclick="this.select();"/>
						<p:commandButton type="button" icon="ui-icon-clipboard" title="Copiar link"
							onclick="var i=this.previousElementSibling; i.select(); navigator.clipboard.writeText(i.value);"/>
					</h:panelGroup>
				</p:column>

				<p:column headerText="Ações" style="width:90px;text-align:center;">
					<p:button icon="ui-icon-pencil" title="Editar" styleClass="btn-edit"
						outcome="editarViagem">
						<f:param name="id" value="#{f.id}"/>
					</p:button>

					<p:commandButton icon="ui-icon-trash" title="Excluir" styleClass="btn-delete"
						process="@this" actionListener="#{calendarioController.removerFrete(f.id)}"
						update=":formViagem:tabela :formViagem:messages">
						<p:confirm header="Confirmação" message="Deseja realmente excluir esta viagem?" icon="pi pi-exclamation-triangle"/>
					</p:commandButton>
				</p:column>

			</p:dataTable>

		</h:form>
	</ui:define>
</ui:composition>
